name: Static Site CI

on:
  schedule:
    - cron: "0 1 * * *"
  repository_dispatch:
    types: [status_website]
  workflow_dispatch:

jobs:
  release:
    name: Build and Deploy Status Website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Generate site
        uses: upptime/status-page@v1.28.3
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}

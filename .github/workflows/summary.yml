name: Summary CI

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  release:
    name: Generate Summary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Update summary
        uses: upptime/uptime-monitor@v1.36.0
        with:
          args: summary
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}

name: Graphs CI

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  release:
    name: Generate Graphs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Generate graphs
        uses: upptime/graphs@v1.13.0
        env:
          GH_PAT: ${{ secrets.GH_PAT || github.token }}
